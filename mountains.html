<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountains — Lucas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,460;1,9..144,420;1,9..144,520&family=Work+Sans:wght@400;500;600&display=swap');
 
:root{
  --bg: #0e1620;
  --bg-panel-2: #17242f;
  --ink: #e9e5d8;
  --ink-soft: #9aa6a1;
  --ink-faint: #6c7773;
  --green: #24413a;
  --navy-line: #1c2a38;
  --brass: #a58a58;
  --brass-soft: rgba(165,138,88,0.55);
  --line: rgba(233,229,216,0.12);
  --wide: 74rem;
}
 
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
 
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans', 'Helvetica Neue', Arial, sans-serif;
  font-weight:400;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
 
.topo{
  position:absolute; inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:
    repeating-radial-gradient(circle at 20% 30%, transparent 0 34px, rgba(233,229,216,0.5) 35px, transparent 36px 70px),
    repeating-radial-gradient(circle at 82% 68%, transparent 0 46px, rgba(233,229,216,0.4) 47px, transparent 48px 92px);
  mix-blend-mode:overlay;
}
 
h1,h2,h3{ margin:0; font-weight:460; font-family:'Fraunces', Georgia, serif; }
p{ margin:0 0 1.1em; color:var(--ink-soft); }
a{ color:inherit; text-decoration:none; }
 
.eyebrow{
  display:block;
  font-size:.78rem;
  letter-spacing:.14em;
  color:var(--brass);
  margin-bottom:.6rem;
  text-transform: uppercase;
}
 
/* ---------------- header / nav ---------------- */
.site-header{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:1.4rem clamp(1.2rem,4vw,3rem);
  background:rgba(14,22,32,.86);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.site-header__mark{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:1.3rem;
  letter-spacing:.02em;
}
.site-header__nav{ display:flex; gap:clamp(1rem,3vw,2.2rem); align-items:center; }
.site-header__nav a{
  font-size:.92rem;
  color:var(--ink-soft);
  border-bottom:1px solid transparent;
  padding-bottom:.2rem;
  transition:color .2s ease, border-color .2s ease;
}
.site-header__nav a:hover, .site-header__nav a:focus-visible{
  color:var(--ink);
  border-color:var(--brass-soft);
}
 
/* ---------------- page hero ---------------- */
.page-hero{
  position:relative;
  padding:clamp(2.6rem,7vw,4rem) clamp(1.2rem,4vw,3rem) clamp(1.8rem,4vw,2.4rem);
  border-bottom:1px solid var(--line);
  overflow:hidden;
  text-align:center;
}
.page-hero__year{
  font-family:'Fraunces', serif;
  font-style:italic;
  color:var(--brass);
  font-size:1.05rem;
  position:relative;
}
.page-hero__title{
  font-size:clamp(2.2rem,6vw,3.4rem);
  margin-top:.3rem;
  position:relative;
}
 
/* ---------------- photo list ---------------- */
.photo-list{
  max-width:var(--wide);
  margin:0 auto;
  padding:clamp(2.4rem,5vw,3.5rem) clamp(1.2rem,4vw,3rem) clamp(4rem,8vw,6rem);
  display:flex;
  flex-direction:column;
  gap:clamp(3rem,6vw,4.5rem);
}
 
.photo-entry__frame{
  overflow:hidden;
  border:1px solid var(--navy-line);
}
.photo-entry__frame img{
  width:100%;
  height:auto;
  display:block;
  transition: transform .5s ease;
}
.photo-entry__frame:hover img{
  transform: scale(1.035);
}
.photo-entry__frame .ph{
  width:100%;
  aspect-ratio: 3 / 2;
  background:
    linear-gradient(155deg, var(--bg-panel-2), var(--green) 70%),
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(233,229,216,.05) 23px 24px);
}
 
.photo-entry__caption{
  margin-top:1rem;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:.4rem 1rem;
}
.photo-entry__title{
  font-family:'Fraunces', serif;
  font-size:clamp(1.3rem,2.6vw,1.65rem);
  color:var(--ink);
}
.photo-entry__meta{
  font-size:.85rem;
  color:var(--ink-faint);
  letter-spacing:.02em;
}
.photo-entry__meta .code{ color:var(--brass); }
 
/* ---------------- footer ---------------- */
.site-footer{
  padding:1.6rem clamp(1.2rem,4vw,3rem) 2.4rem;
  font-size:.82rem;
  color:var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem;
  border-top:1px solid var(--line);
}
 
:focus-visible{ outline:1px solid var(--brass); outline-offset:3px; }
</style>
</head>
<body>
 
<header class="site-header">
  <a class="site-header__mark" href="index.html">Lucas</a>
  <nav class="site-header__nav">
    <a href="index.html#themes">Themes</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>
 
<section class="page-hero">
  <div class="topo" aria-hidden="true"></div>
  <span class="page-hero__year">Theme 01</span>
  <h1 class="page-hero__title">Mountains</h1>
</section>
 
<div class="photo-list">
 
  <figure class="photo-entry">
    <div class="photo-entry__frame">
      <img src="photo/mountains-1.jpg" alt="Ridgeline, First Light" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="ph" style="display:none;"></div>
    </div>
    <figcaption class="photo-entry__caption">
      <span class="photo-entry__title">Ridgeline, First Light</span>
      <span class="photo-entry__meta"><span class="code">MTN-01</span> — March 2025</span>
    </figcaption>
  </figure>
 
  <figure class="photo-entry">
    <div class="photo-entry__frame">
      <img src="photo/mountains-2.jpg" alt="Above the Treeline" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="ph" style="display:none;"></div>
    </div>
    <figcaption class="photo-entry__caption">
      <span class="photo-entry__title">Above the Treeline</span>
      <span class="photo-entry__meta"><span class="code">MTN-02</span> — March 2025</span>
    </figcaption>
  </figure>
 
  <figure class="photo-entry">
    <div class="photo-entry__frame">
      <img src="photo/mountains-3.jpg" alt="Cloud Inversion" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="ph" style="display:none;"></div>
    </div>
    <figcaption class="photo-entry__caption">
      <span class="photo-entry__title">Cloud Inversion</span>
      <span class="photo-entry__meta"><span class="code">MTN-03</span> — July 2025</span>
    </figcaption>
  </figure>
 
  <figure class="photo-entry">
    <div class="photo-entry__frame">
      <img src="photo/mountains-4.jpg" alt="Alpine Traverse" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="ph" style="display:none;"></div>
    </div>
    <figcaption class="photo-entry__caption">
      <span class="photo-entry__title">Alpine Traverse</span>
      <span class="photo-entry__meta"><span class="code">MTN-04</span> — July 2025</span>
    </figcaption>
  </figure>
 
  <figure class="photo-entry">
    <div class="photo-entry__frame">
      <img src="photo/mountains-5.jpg" alt="Snowfield, Late Season" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="ph" style="display:none;"></div>
    </div>
    <figcaption class="photo-entry__caption">
      <span class="photo-entry__title">Snowfield, Late Season</span>
      <span class="photo-entry__meta"><span class="code">MTN-05</span> — April 2026</span>
    </figcaption>
  </figure>
 
</div>
 
<footer class="site-footer">
  <span>Lucas — Nature &amp; Travel Photography</span>
  <span>Mountains — 5 photographs</span>
</footer>
 
</body>
</html>
